name: "QA deployment"

concurrency: "1"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  deploy:
    name: "Deploy bundle"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.2.2

      - name: Deploy DAB to QA
        run: databricks bundle deploy --target qa
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_environment: qa

  run_job:
    name: "Run Job"
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.2.2

      - name: Run DAB Job on QA
        run: databricks bundle run sample_job --target qa --refresh-all
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_environment: qa