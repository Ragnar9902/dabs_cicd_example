# This is a Declarative Automation Bundle definition for bundle_test.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bundle_test
  uuid: 45e0ae4b-5177-4b25-a78e-13a1197a8b62

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets .
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405619367988752.12.azuredatabricks.net
    variables:
      catalog: agrotech
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405619367988752.12.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/jesus.macias@uniminuto.edu.co to make sure we only have a single copy.
      root_path: /Workspace/Users/jesus.macias@uniminuto.edu.co/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: agrotech
      schema: prod
    permissions:
      - user_name: jesus.macias@uniminuto.edu.co
        level: CAN_MANAGE
